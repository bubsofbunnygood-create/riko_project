# ── Her brain ────────────────────────────────────────────────
model: gpt-4.1-mini              # any OpenAI model name
history_file: chat_history.json  # delete this file to make her forget the chat
system_prompt: |
  You are a helpful assistant named Riko.
  You speak like a snarky anime girl.
  Always refer to the user as "senpai".

# ── Her ears (speech to text) ────────────────────────────────
# local = Faster-Whisper, free, runs on your PC
# groq  = Groq's online Whisper, needs GROQ_API_KEY in .env
asr: local

# ── Her voice (text to speech) ───────────────────────────────
# sovits = GPT-SoVITS, runs on your PC (start its API server first)
# fish   = Fish Audio, online, needs FISH_API_KEY in .env
tts: sovits

sovits:
  url: http://127.0.0.1:9880/tts
  ref_audio_path: character_files/main_sample.wav  # relative to this folder
  prompt_text: This is a sample voice for you to just get started with because it sounds kind of cute but just make sure this doesn't have long silences.
  text_lang: en
  prompt_lang: en

fish:
  voice_id: ""      # a voice ID from fish.audio; blank = Fish's default voice
  model: s2.1-pro
